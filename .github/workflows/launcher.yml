# Costruisce il launcher già pronto per Windows (exe) e macOS (dmg) e lo prova come farebbe un cliente,
# su macchine vere di GitHub. Parte solo quando cambia il launcher o i suoi pacchetti, oppure a mano.
name: Launcher
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["launcher/**", "packages/**", "strumenti/prova_launcher.py", ".github/workflows/launcher.yml"]
permissions:
  contents: write
jobs:
  costruisci:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nome: windows
          - os: macos-latest
            nome: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Costruisce il programma
        shell: bash
        run: |
          python -m pip install --quiet pyinstaller
          python -m PyInstaller --onefile --console --name alvea-launcher --hidden-import imaplib --hidden-import smtplib --hidden-import email.header --hidden-import email.message --hidden-import ssl --hidden-import tempfile --hidden-import getpass launcher/alvea_launcher.py
          mkdir -p pronto && cp launcher/LEGGIMI.txt pronto/
      - name: Prepara l'exe (Windows)
        if: matrix.nome == 'windows'
        shell: bash
        run: cp dist/alvea-launcher.exe pronto/ && cp dist/alvea-launcher.exe Alvea-Launcher.exe
      - name: Prepara il dmg (macOS)
        if: matrix.nome == 'macos'
        shell: bash
        run: |
          mkdir dmgroot && cp dist/alvea-launcher dmgroot/ && cp launcher/LEGGIMI.txt dmgroot/
          hdiutil create -volname "Alvea Launcher" -srcfolder dmgroot -ov -format UDZO Alvea-Launcher.dmg
          hdiutil attach Alvea-Launcher.dmg -mountpoint /tmp/alvea-dmg -nobrowse -readonly
          cp /tmp/alvea-dmg/alvea-launcher pronto/   # si prova proprio il programma tirato fuori dal dmg
          hdiutil detach /tmp/alvea-dmg
          file pronto/alvea-launcher
      - name: Prova come un cliente
        shell: bash
        run: python strumenti/prova_launcher.py pronto
      - uses: actions/upload-artifact@v4
        with:
          name: alvea-launcher-${{ matrix.nome }}
          path: |
            Alvea-Launcher.exe
            Alvea-Launcher.dmg
      - name: Pubblica tra i rilasci
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="Alvea-Launcher.${{ matrix.nome == 'windows' && 'exe' || 'dmg' }}"
          # i due lavori arrivano qui quasi insieme: se il rilascio l'ha già creato l'altro, si va avanti
          gh release view launcher >/dev/null 2>&1 || gh release create launcher --title "Launcher di Alvea" --notes "Programmi del launcher costruiti e provati in automatico su macOS e Windows. Non sono firmati: vedi GUIDA.md." --latest=false || true
          gh release upload launcher "$f" --clobber
