name: Carico
# Il server sotto carico come al lancio: molte aziende insieme, launcher in attesa, connessioni ferme, spegnimento brusco.
# Dura qualche minuto: non parte a ogni modifica, ma quando cambia la prova stessa, a mano e ogni lunedì.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"
  push:
    branches: [main]
    paths:
      - "strumenti/prova_carico.py"
      - ".github/workflows/carico.yml"
jobs:
  carico:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet cryptography
      - name: 60 aziende insieme per 40 secondi, poi connessioni ferme e spegnimento brusco
        run: python strumenti/prova_carico.py 60 40
